name: Build K3 kernel

on:
  push:
    branches: [ k3-master-hmp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k3-master-hmp
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu build-essential bc bison flex \
            cpio kmod rsync libssl-dev libelf-dev dpkg-dev debhelper python3

      - name: Configure
        run: |
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- defconfig
          ./scripts/config -d DEBUG_INFO -e DEBUG_INFO_NONE
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig

      - name: Build deb packages
        run: make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j$(nproc) bindeb-pkg

      - name: Collect
        run: |
          mkdir out
          mv ../*.deb out/

      - uses: actions/upload-artifact@v4
        with:
          name: k3-kernel-debs
          path: out/*.deb
